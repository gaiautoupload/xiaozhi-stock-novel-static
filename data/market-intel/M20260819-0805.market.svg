 <title id="t">08:05市場即時與ABC波段</title><desc id="d">台股開盤前跨資產、匯率、ABC情境、輪動與風險。</desc>
 <rect width="1200" height="900" fill="#06131f"/><rect x="38" y="34" width="1124" height="832" rx="28" fill="#0b1e2d" stroke="#2c4c63"/>
 <style>text{font-family:system-ui,'Noto Sans TC',sans-serif;fill:#eef7fb}.m{fill:#9eb4c0}.c{fill:#58ddd2}.a{fill:#ffd16b}.r{fill:#ff8291}.card{fill:#112a3b;stroke:#2c4c63}.s{font-size:19px}.md{font-size:25px;font-weight:700}.lg{font-size:40px;font-weight:800}</style>
 <text x="74" y="94" class="lg">市場即時／波段｜08:05 開盤前</text><text x="74" y="132" class="s m">休市狀態：加權、櫃買、廣度與三大法人等待新交易時段</text>
 <g transform="translate(74 160)"><rect class="card" width="510" height="148" rx="18"/><text x="22" y="40" class="md c">台股與匯率</text><text x="22" y="77" class="s">加權 45,308.68（8/18收盤）</text><text x="22" y="108" class="s">USD/TWD 官方收 31.945</text><text x="22" y="137" class="s m">民間中間價約31.90–31.93，口徑不同</text></g>
 <g transform="translate(616 160)"><rect class="card" width="510" height="148" rx="18"/><text x="22" y="40" class="md a">隔夜壓力</text><text x="22" y="77" class="s">NASDAQ −1.33%｜SOX約−4.98%</text><text x="22" y="108" class="s">TSM 413.41｜−4.07%</text><text x="22" y="137" class="s">30Y 5.2922%｜Brent 91.02</text></g>
 <rect class="card" x="74" y="336" width="1052" height="154" rx="18"/><text x="98" y="378" class="md a">ABC情境｜A段風險釋放（信心63%）</text><text x="98" y="415" class="s">錨點：46,064.09高／45,225.42低／45,308.68收；尚無新OHLC確認B段。</text><text x="98" y="449" class="s">支撐45,225.42／45,000｜反壓45,857.27／46,064.09</text><text x="98" y="479" class="s m">替代：權值止穩＋台幣回穩＋上市櫃廣度改善，才評估B段反彈；不是預言。</text>
 <g transform="translate(74 520)"><rect class="card" width="324" height="140" rx="18"/><text x="20" y="39" class="md c">Bullish</text><text x="20" y="75" class="s">守支撐、權值止跌</text><text x="20" y="105" class="s">台幣回穩、族群共振</text><text x="20" y="132" class="s m">確認後才提高曝險</text></g>
 <g transform="translate(438 520)"><rect class="card" width="324" height="140" rx="18"/><text x="20" y="39" class="md a">Base</text><text x="20" y="75" class="s">震盪測試45,225</text><text x="20" y="105" class="s">防禦／現金相對強</text><text x="20" y="132" class="s m">五檔全WAIT</text></g>
 <g transform="translate(802 520)"><rect class="card" width="324" height="140" rx="18"/><text x="20" y="39" class="md r">Bearish</text><text x="20" y="75" class="s">跌破支撐、電子擴跌</text><text x="20" y="105" class="s">台幣走弱、油債高壓</text><text x="20" y="132" class="s m">撤追價、守現金</text></g>
 <rect class="card" x="74" y="690" width="1052" height="142" rx="18"/><text x="98" y="732" class="md">下一交易時段確認</text><text x="98" y="769" class="s">08:30可靠盤前報價｜09:00–09:20上市櫃廣度與量｜台積電承接｜USD/TWD方向</text><text x="98" y="801" class="s r">風險：長債高殖利率、SOX急跌、油價／地緣政治、展會題材提前反映。</text><text x="98" y="824" class="s m">自動化展8/19–22舉行，只作公開驗證窗口。</text>
