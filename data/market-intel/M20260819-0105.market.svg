<g font-family="sans-serif">
<rect x="78" y="158" width="330" height="128" rx="16" fill="#13283d"/><text x="104" y="194" fill="#fff" font-size="21">加權指數</text><text x="104" y="235" fill="#ff8d8d" font-size="30" font-weight="700">45,308.68</text><text x="104" y="267" fill="#ffaaaa" font-size="17">-548.59｜-1.20%</text>
<rect x="435" y="158" width="330" height="128" rx="16" fill="#13283d"/><text x="461" y="194" fill="#fff" font-size="21">櫃買指數</text><text x="461" y="235" fill="#ff8d8d" font-size="30" font-weight="700">390.83</text><text x="461" y="267" fill="#ffaaaa" font-size="17">-7.49｜-1.88%</text>
<rect x="792" y="158" width="330" height="128" rx="16" fill="#13283d"/><text x="818" y="194" fill="#fff" font-size="21">USD/TWD</text><text x="818" y="235" fill="#f5cf72" font-size="30" font-weight="700">31.926</text><text x="818" y="267" fill="#d8c590" font-size="17">USD +0.17%｜台幣偏弱</text>
<rect x="78" y="314" width="1044" height="108" rx="16" fill="#112943"/><text x="104" y="350" fill="#fff" font-size="22" font-weight="700">隔夜跨資產壓力</text><text x="104" y="383" fill="#dbe7f2" font-size="18">Nasdaq 約 -1.06%｜SOX 約 -3.7%｜台積電 ADR 約 -4.05%｜美10年債約 4.71%</text><text x="104" y="409" fill="#91a9c3" font-size="15">美元指數僅確認小幅走高；USD/JPY最新可靠值為8/14的159.32（stale）。</text>
<rect x="78" y="450" width="650" height="240" rx="16" fill="#12263a"/><text x="104" y="488" fill="#fff" font-size="23" font-weight="700">ABC 情境（不是預言）</text>
