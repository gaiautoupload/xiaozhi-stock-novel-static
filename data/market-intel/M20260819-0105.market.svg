<text x="104" y="653" fill="#dbe7f2" font-size="16">較像A段初跌・信心42%</text><text x="104" y="677" fill="#91a9c3" font-size="15">站回45,857看B反彈；破45,225防C延伸。</text>
<rect x="752" y="450" width="370" height="240" rx="16" fill="#12263a"/><text x="778" y="488" fill="#fff" font-size="23" font-weight="700">資金與廣度</text><text x="778" y="525" fill="#ffaaaa" font-size="17">上市：230漲／803跌</text><text x="778" y="558" fill="#ffaaaa" font-size="17">外資 -119.86億</text><text x="778" y="591" fill="#7de1ae" font-size="17">投信 +56.63億</text><text x="778" y="624" fill="#ffaaaa" font-size="17">三法人合計 -239.3億</text><text x="778" y="662" fill="#91a9c3" font-size="15">金融、食品相對強；高位階電子弱。</text>
<rect x="78" y="720" width="1044" height="154" rx="16" fill="#0b2238"/><text x="104" y="758" fill="#fff" font-size="22" font-weight="700">三情境與下一步</text><text x="104" y="794" fill="#72dda9" font-size="16">多：守45,225、站回45,857，電子與機器人2–3檔共振。</text><text x="104" y="824" fill="#f5cf72" font-size="16">中：45,225–45,857震盪，高速輪動；前20分鐘只確認。</text><text x="104" y="854" fill="#ff9b9b" font-size="16">空：破45,225＋廣度惡化＋ADR/SOX弱勢延續，防高Beta補跌。</text>
</g>
<text x="78" y="917" fill="#91a9c3" font-family="sans-serif" font-size="15">風險：美國半導體、長債殖利率、中東／油價、台幣偏弱、事件題材提前反映</text><text x="78" y="942" fill="#6f87a0" font-family="sans-serif" font-size="14">資料時間不同已標示；無可靠數字者留白，不構成投資建議。</text>
