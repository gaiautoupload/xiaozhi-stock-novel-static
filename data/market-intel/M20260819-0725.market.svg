<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">M20260819-0725 市場即時與波段卡</title><desc id="d">台股開盤前的跨資產風險、ABC情境與下一交易時段觀察。</desc>
  <rect width="1200" height="900" fill="#06131d"/><rect x="38" y="34" width="1124" height="832" rx="28" fill="#0b1d2a" stroke="#28495c"/>
  <style>text{font-family:system-ui,'Noto Sans TC',sans-serif;fill:#eef7fb}.muted{fill:#9bb3c0}.cyan{fill:#58ddd2}.amber{fill:#ffd16b}.red{fill:#ff8291}.card{fill:#102a39;stroke:#285066}.s{font-size:19px}.m{font-size:25px;font-weight:650}.b{font-size:40px;font-weight:800}</style>
  <text x="76" y="94" class="b">市場即時／波段｜07:25 開盤前</text><text x="76" y="132" class="s muted">休市狀態；台股加權、櫃買與三大法人等待新交易時段，未冒充即時成交。</text>
  <g transform="translate(76 164)"><rect class="card" width="504" height="146" rx="18"/><text x="24" y="40" class="m cyan">跨資產快照</text><text x="24" y="76" class="s">NASDAQ −1.33%｜SOX −4.98%</text><text x="24" y="106" class="s">TSM ADR 413.41｜−4.07%</text><text x="24" y="134" class="s">美30年債收 5.2922%｜油價風險偏高</text></g>
  <g transform="translate(620 164)"><rect class="card" width="504" height="146" rx="18"/><text x="24" y="40" class="m amber">匯率與台股</text><text x="24" y="76" class="s">USD/TWD 8/18 官方收盤 31.945</text><text x="24" y="106" class="s">較前收31.852走弱；壓抑外資風險偏好</text><text x="24" y="134" class="s muted">出口商換匯有利，但電子估值與進口成本承壓</text></g>
  <rect class="card" x="76" y="340" width="1048" height="152" rx="18"/><text x="100" y="382" class="m amber">ABC 情境分析｜A段延伸／風險去化中（信心 63%）</text><text x="100" y="419" class="s">主要：海外半導體急跌＋長債高檔，台股開盤先測支撐與量能；不是確定預言。</text><text x="100" y="450" class="s">替代：權值快速止穩、台幣回升，可能轉為B段反彈；可靠新OHLC未出，數值支撐／壓力標 insufficient_data。</text><text x="100" y="480" class="s muted">失效：新交易時段價格與廣度明顯否定A段結構。</text>
  <g transform="translate(76 522)"><rect class="card" width="324" height="150" rx="18"/><text x="22" y="40" class="m cyan">Bullish</text><text x="22" y="74" class="s">ADR止跌、台幣轉強</text><text x="22" y="104" class="s">權值守穩、廣度改善</text><text x="22" y="134" class="s muted">確認後才提高曝險</text></g>
  <g transform="translate(438 522)"><rect class="card" width="324" height="150" rx="18"/><text x="22" y="40" class="m amber">Base</text><text x="22" y="74" class="s">開低後震盪找支撐</text><text x="22" y="104" class="s">防禦／現金相對強</text><text x="22" y="134" class="s muted">五檔觀察皆WAIT</text></g>
  <g transform="translate(800 522)"><rect class="card" width="324" height="150" rx="18"/><text x="22" y="40" class="m red">Bearish</text><text x="22" y="74" class="s">半導體續弱、台幣再貶</text><text x="22" y="104" class="s">長債／油價壓力擴大</text><text x="22" y="134" class="s muted">守現金、撤銷追價計畫</text></g>
  <rect class="card" x="76" y="702" width="1048" height="132" rx="18"/><text x="100" y="742" class="m">下一確認</text><text x="100" y="778" class="s">08:30前後盤前報價可信度｜09:00加權／櫃買開盤廣度與量｜USD/TWD方向｜權值是否止跌</text><text x="100" y="810" class="s red">風險旗號：美國30年債高殖利率、SOX急跌、油價與地緣政治、Fed紀要／重大財報。</text>
</svg>
