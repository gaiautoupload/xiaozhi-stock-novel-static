<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#06101d"/><rect x="35" y="35" width="1130" height="1530" rx="30" fill="#0d1b2a" stroke="#2b6cb0" stroke-width="3"/>
<text x="75" y="105" fill="#fff" font-size="40" font-family="sans-serif" font-weight="700">市場即時／波段｜M20260819-2325</text><text x="75" y="150" fill="#8fb8ff" font-size="22" font-family="sans-serif">歷史回補｜台股已收盤｜美股盤中精確報價部分 unavailable</text>
<text x="75" y="225" fill="#ffd166" font-size="30" font-family="sans-serif" font-weight="700">大盤</text><text x="75" y="270" fill="#eef5ff" font-size="25" font-family="sans-serif">TAIEX 44,719.35  ▼589.33（-1.30%）</text><text x="75" y="310" fill="#eef5ff" font-size="25" font-family="sans-serif">TPEx 384.79  ▼6.04（-1.55%）｜成交 1,793.19 億</text><text x="75" y="350" fill="#ff8a80" font-size="23" font-family="sans-serif">上漲387／下跌605｜三大法人賣超708.48億元</text>
<text x="75" y="430" fill="#7ee787" font-size="30" font-family="sans-serif" font-weight="700">USD/TWD</text><text x="75" y="475" fill="#eef5ff" font-size="25" font-family="sans-serif">31.937（前值31.945）｜新臺幣小升0.008</text><text x="75" y="515" fill="#b8c7d9" font-size="21" font-family="sans-serif">略降進口成本與估值壓力；外資仍賣超，不能視為回流確認。</text>
<text x="75" y="595" fill="#8fb8ff" font-size="30" font-family="sans-serif" font-weight="700">跨資產與重磅消息</text><text x="75" y="640" fill="#eef5ff" font-size="22" font-family="sans-serif">21:43舊快照：NASDAQ約+0.4%；DXY 98.95（-0.7%）</text><text x="75" y="675" fill="#eef5ff" font-size="22" font-family="sans-serif">美30年債5.208%，盤中低5.188%；23:25精確值標stale</text><text x="75" y="710" fill="#eef5ff" font-size="22" font-family="sans-serif">財政部擴大長債回購；Unitree上市大漲，機器人題材受催化</text>
<text x="75" y="790" fill="#f0b35a" font-size="30" font-family="sans-serif" font-weight="700">ABC 情境</text><text x="75" y="835" fill="#eef5ff" font-size="23" font-family="sans-serif">主情境：急跌A後弱B準備；替代：A段尚未結束</text><text x="75" y="875" fill="#eef5ff" font-size="23" font-family="sans-serif">支撐 44,308.71｜壓力 44,811／45,071.34｜信心 medium-low</text><text x="75" y="915" fill="#b8c7d9" font-size="21" font-family="sans-serif">跌破支撐且量增偏A延伸；收復45,071並改善廣度才提高弱B機率。</text>
<text x="75" y="995" fill="#ff7aa2" font-size="30" font-family="sans-serif" font-weight="700">輪動</text><text x="75" y="1040" fill="#eef5ff" font-size="22" font-family="sans-serif">較強：食品、造紙、機器人題材｜較弱：塑化、權值、高估值成長</text>
<text x="75" y="1120" fill="#ff6b6b" font-size="30" font-family="sans-serif" font-weight="700">三情境</text><text x="75" y="1165" fill="#eef5ff" font-size="21" font-family="sans-serif">Bull：長債／美元續降＋收復45,071＋機器人量價擴散</text><text x="75" y="1200" fill="#eef5ff" font-size="21" font-family="sans-serif">Base：44,308～45,071震盪，弱B受法人賣壓壓制</text><text x="75" y="1235" fill="#eef5ff" font-size="21" font-family="sans-serif">Bear：長債、油價再升，權值續弱並跌破44,308</text>
<text x="75" y="1315" fill="#ffd166" font-size="30" font-family="sans-serif" font-weight="700">下一交易時段</text><text x="75" y="1360" fill="#eef5ff" font-size="21" font-family="sans-serif">看外資、ADR／現股同步、季線44,811、機器人量價是否擴散。</text><text x="75" y="1400" fill="#ff8a80" font-size="21" font-family="sans-serif">風險：精確跨資產報價不足、法人賣超、長債效果短暫、地緣與油價。</text>
<text x="75" y="1510" fill="#7890a8" font-size="18" font-family="sans-serif">ABC為情境推演，不是預言；本卡不構成投資建議。</text>
</svg>
