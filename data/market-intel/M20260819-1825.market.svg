<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#07131f"/><text x="55" y="70" fill="#f4c46d" font-size="34" font-family="sans-serif" font-weight="700">市場即時／波段｜2026-08-19 18:25 二次驗證</text><g font-family="sans-serif"><rect x="45" y="100" width="535" height="170" rx="20" fill="#11283a"/><text x="75" y="145" fill="#8ed6ff" font-size="25" font-weight="700">大盤收盤</text><text x="75" y="190" fill="#fff" font-size="27">TAIEX 44,719.35　-1.30%</text><text x="75" y="230" fill="#fff" font-size="24">TPEx 384.79　-1.55%</text><rect x="620" y="100" width="535" height="170" rx="20" fill="#11283a"/><text x="650" y="145" fill="#8ed6ff" font-size="25" font-weight="700">匯率與法人</text><text x="650" y="190" fill="#fff" font-size="25">USD/TWD 31.937</text><text x="650" y="230" fill="#ffb0ba" font-size="22">三大法人 -708.48億元</text><rect x="45" y="300" width="1110" height="150" rx="20" fill="#11283a"/><text x="75" y="345" fill="#a9efb0" font-size="25" font-weight="700">18:25 驗證結論</text><text x="75" y="390" fill="#fff" font-size="23">未見目標時點前的新官方數據推翻 18:05 情境。</text><text x="75" y="428" fill="#fff" font-size="22">廣度仍弱；半導體與高beta AI承壓，較強為周邊、部分光學、航運、被動元件。</text><rect x="45" y="480" width="1110" height="210" rx="20" fill="#11283a"/><text x="75" y="525" fill="#f4c46d" font-size="25" font-weight="700">ABC 情境（非預言）</text><text x="75" y="568" fill="#fff" font-size="23">維持 A 急跌後弱 B 準備；替代情境為 A 段延伸。</text><text x="75" y="610" fill="#a9efb0" font-size="22">支撐 44,308.71</text><text x="360" y="610" fill="#ffcf91" font-size="22">壓力 44,811／45,000／45,071.34</text><text x="75" y="650" fill="#fff" font-size="21">反彈須有權值、廣度與量能共同確認，不能把ABC當成確定預言。</text><rect x="45" y="720" width="1110" height="125" rx="20" fill="#11283a"/><text x="75" y="765" fill="#ffb0ba" font-size="25" font-weight="700">風險</text><text x="75" y="807" fill="#fff" font-size="21">法人賣超、科技股弱勢、高殖利率與油價；ADR／期指／DXY／US10Y／USDJPY unavailable/stale。</text></g></svg>
