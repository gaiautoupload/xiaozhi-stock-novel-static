<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900"><rect width="1200" height="900" fill="#07131f"/><text x="55" y="70" fill="#f4c46d" font-size="34" font-family="sans-serif" font-weight="700">市場即時／波段｜2026-08-19 19:05 二次驗證</text><g font-family="sans-serif"><rect x="45" y="100" width="535" height="170" rx="20" fill="#11283a"/><text x="75" y="145" fill="#8ed6ff" font-size="25" font-weight="700">台股收盤</text><text x="75" y="190" fill="#fff" font-size="27">TAIEX 44,719.35　-1.30%</text><text x="75" y="230" fill="#fff" font-size="24">TPEx 384.79　-1.55%</text><rect x="620" y="100" width="535" height="170" rx="20" fill="#11283a"/><text x="650" y="145" fill="#8ed6ff" font-size="25" font-weight="700">匯率／法人</text><text x="650" y="190" fill="#fff" font-size="25">USD/TWD 31.937</text><text x="650" y="230" fill="#ffb0ba" font-size="22">三大法人 -708.48億元</text><rect x="45" y="300" width="1110" height="165" rx="20" fill="#11283a"/><text x="75" y="345" fill="#a9efb0" font-size="25" font-weight="700">19:05 二次驗證</text><text x="75" y="388" fill="#fff" font-size="22">未見新官方資料推翻18:45：機器人題材有催化，法人與廣度仍偏空。</text><text x="75" y="428" fill="#fff" font-size="22">較強：周邊、部分光學、航運、被動元件｜較弱：半導體、高beta AI。</text><rect x="45" y="495" width="1110" height="205" rx="20" fill="#11283a"/><text x="75" y="540" fill="#f4c46d" font-size="25" font-weight="700">ABC 情境（非預言）</text><text x="75" y="582" fill="#fff" font-size="23">弱B反彈準備／A段延伸雙情境維持。</text><text x="75" y="625" fill="#a9efb0" font-size="22">支撐 44,308.71</text><text x="350" y="625" fill="#ffcf91" font-size="22">壓力 44,811／45,000／45,071.34</text><text x="75" y="665" fill="#fff" font-size="21">機器人量價擴散＋權值止跌＋外資回流，才提高多方情境可信度。</text><rect x="45" y="730" width="1110" height="120" rx="20" fill="#11283a"/><text x="75" y="775" fill="#ffb0ba" font-size="25" font-weight="700">風險</text><text x="75" y="817" fill="#fff" font-size="21">法人賣超、長債高殖利率、題材擁擠；ADR／期指／DXY／US10Y／USDJPY unavailable。</text></g></svg>
