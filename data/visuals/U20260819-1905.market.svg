<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#120e1b"/><rect x="42" y="42" width="1116" height="546" rx="28" fill="#21172e" stroke="#755a8d"/><text x="75" y="110" fill="#f4c46d" font-size="38" font-family="sans-serif" font-weight="700">第八十回｜她若愛上他，十億就消失</text><text x="75" y="165" fill="#f0e3ff" font-size="25" font-family="sans-serif">錨定人 × 假條款 × 雙生顧知夏</text><text x="75" y="235" fill="#9ad8ff" font-size="28" font-family="sans-serif" font-weight="700">爽點</text><text x="75" y="276" fill="#fff" font-size="22" font-family="sans-serif">小智用雙墨層拆穿「相愛條款」，奪回稽核案主導權。</text><text x="75" y="342" fill="#ff9fb4" font-size="28" font-family="sans-serif" font-weight="700">修羅場</text><text x="75" y="383" fill="#fff" font-size="22" font-family="sans-serif">沈妍書貼耳、顧知夏拉領帶；小智扶腰回撩，差點接吻。</text><text x="75" y="449" fill="#a9efb0" font-size="28" font-family="sans-serif" font-weight="700">財富紀律</text><text x="75" y="490" fill="#fff" font-size="22" font-family="sans-serif">6,800萬元只是未簽預算上限；三階段驗收付款後才認列。</text><text x="75" y="552" fill="#f4c46d" font-size="22" font-family="sans-serif">鉤子：另一個顧知夏挽著林婉清離開，桌上留下偽造簽名。</text></svg>
