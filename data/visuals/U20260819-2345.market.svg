<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#07111f"/><rect x="40" y="40" width="1120" height="820" rx="28" fill="#0d1b2d" stroke="#6f42c1" stroke-width="3"/>
<text x="80" y="105" fill="#fff" font-size="38" font-family="sans-serif" font-weight="700">第九十四回｜戒指裡的扳機</text><text x="80" y="155" fill="#b9a4ff" font-size="24" font-family="sans-serif">U20260819-2345｜控制權陷阱 × 法遵拆局</text>
<text x="80" y="225" fill="#ffd166" font-size="30" font-family="sans-serif" font-weight="700">爽點</text><text x="80" y="270" fill="#eef5ff" font-size="24" font-family="sans-serif">小智揭穿「假平倉、真收購」，逼三億二千萬買方先公開身分。</text>
<text x="80" y="340" fill="#ff7aa2" font-size="30" font-family="sans-serif" font-weight="700">情感張力</text><text x="80" y="385" fill="#eef5ff" font-size="24" font-family="sans-serif">他抓住沈妍書手腕，把她抱回懷裡，貼耳回撩她的吃醋。</text>
<text x="80" y="455" fill="#7ee787" font-size="30" font-family="sans-serif" font-weight="700">誠實帳本</text><text x="80" y="500" fill="#eef5ff" font-size="24" font-family="sans-serif">26,000元｜成交0｜收入0｜3.2億保證金未入監管，不列資產</text>
<text x="80" y="570" fill="#f0b35a" font-size="30" font-family="sans-serif" font-weight="700">股票法遵</text><text x="80" y="615" fill="#eef5ff" font-size="24" font-family="sans-serif">4576維持B／WAIT；未公開控制權線索不得作為交易依據。</text>
<text x="80" y="685" fill="#ff6b6b" font-size="30" font-family="sans-serif" font-weight="700">下一回鉤子</text><text x="80" y="730" fill="#eef5ff" font-size="24" font-family="sans-serif">若棠被冒名登記為董事長，驗證影像竟偷拍自同一會議室。</text>
<text x="80" y="810" fill="#7890a8" font-size="18" font-family="sans-serif">小說事件與公開市場事實分離；不構成投資建議。</text>
</svg>
