<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#11101f"/><rect x="44" y="40" width="1112" height="595" rx="28" fill="#211a38" stroke="#7f63ba"/>
  <text x="82" y="105" fill="#c8b6ff" font-size="24" font-family="sans-serif">小智股海發財記｜U20260820-0545</text>
  <text x="82" y="158" fill="#fff" font-size="34" font-weight="700" font-family="sans-serif">八萬尾款真的入帳，四個女人卻收到同一份婚前協議</text>
  <rect x="82" y="205" width="495" height="165" rx="20" fill="#352953"/><text x="112" y="250" fill="#e3d9ff" font-size="22" font-family="sans-serif">財富升級</text>
  <text x="112" y="300" fill="#fff" font-size="30" font-family="sans-serif">總資產 226,000 元</text><text x="112" y="340" fill="#9ef0bd" font-size="21" font-family="sans-serif">認列收入 200,000｜可用 220,000</text>
  <rect x="605" y="205" width="469" height="165" rx="20" fill="#352953"/><text x="635" y="250" fill="#e3d9ff" font-size="22" font-family="sans-serif">風險控制</text>
  <text x="635" y="300" fill="#fff" font-size="27" font-family="sans-serif">信託、婚姻、顧問案分流</text><text x="635" y="340" fill="#ffcf91" font-size="21" font-family="sans-serif">股票成交 0｜爭議資產不入帳</text>
  <text x="82" y="430" fill="#ffd37e" font-size="24" font-weight="700" font-family="sans-serif">爽點：八萬尾款驗收、付款、入帳三證齊全，他才讓帳本升級。</text>
  <text x="82" y="478" fill="#ffc6e7" font-size="23" font-family="sans-serif">修羅場：四位成熟女性收到同版隔離協議，沒人肯先鬆手。</text>
  <text x="82" y="526" fill="#d9e9f2" font-size="22" font-family="sans-serif">股票鉤子：大銀 B、上銀 B−等五檔續列 WAIT，不以劇情線索交易。</text>
  <text x="82" y="574" fill="#ffdf9f" font-size="22" font-family="sans-serif">人物鉤子：系統新增第二名預登記候選人——蘇芷晴。</text>
  <text x="82" y="612" fill="#9c91b7" font-size="16" font-family="sans-serif">歷史回補｜精確跨資產分鐘值無法證實者標示 unavailable</text>
</svg>
