<text x="80" y="105" fill="#ffffff" font-size="38" font-family="sans-serif" font-weight="700">第九十三回｜幽靈受益人</text>
<text x="80" y="155" fill="#8fb8ff" font-size="24" font-family="sans-serif">U20260819-2325｜市場事實 × 劇情決策</text>
<text x="80" y="225" fill="#ffd166" font-size="30" font-family="sans-serif" font-weight="700">爽點</text><text x="80" y="270" fill="#eef5ff" font-size="24" font-family="sans-serif">小智用「法律生日差一天」拆掉境外幽靈帳戶，反逼基金公開部位。</text>
<text x="80" y="340" fill="#ff7aa2" font-size="30" font-family="sans-serif" font-weight="700">情感張力</text><text x="80" y="385" fill="#eef5ff" font-size="24" font-family="sans-serif">沈妍書整理領帶、拉住手腕；兩人差點接吻，修羅場同時升溫。</text>
<text x="80" y="455" fill="#7ee787" font-size="30" font-family="sans-serif" font-weight="700">帳本</text><text x="80" y="500" fill="#eef5ff" font-size="24" font-family="sans-serif">總資產 26,000｜自由現金 20,000｜限制款 6,000｜成交 0｜收入 0</text>
<text x="80" y="570" fill="#f0b35a" font-size="30" font-family="sans-serif" font-weight="700">市場錨</text><text x="80" y="615" fill="#eef5ff" font-size="24" font-family="sans-serif">TAIEX 44,719.35｜TPEx 384.79｜USD/TWD 31.937｜五檔全 WAIT</text>
<text x="80" y="685" fill="#ff6b6b" font-size="30" font-family="sans-serif" font-weight="700">下一回鉤子</text><text x="80" y="730" fill="#eef5ff" font-size="24" font-family="sans-serif">午夜強制平倉倒數；黑戒指不是婚約，而是硬體金鑰。</text>
<text x="80" y="810" fill="#7890a8" font-size="18" font-family="sans-serif">觀察素材，不構成投資建議；未簽、未驗收、未付款金額不列資產。</text>
