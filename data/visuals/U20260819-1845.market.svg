<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#07131f"/><rect x="42" y="42" width="1116" height="546" rx="28" fill="#10263a" stroke="#3d6684"/><text x="75" y="110" fill="#f4c46d" font-size="38" font-family="sans-serif" font-weight="700">第七十九回｜十億是一副鍍金手銬</text><text x="75" y="165" fill="#dcefff" font-size="25" font-family="sans-serif">死者身分 × 強制代理 × 七分鐘腕帶</text><text x="75" y="235" fill="#8ed6ff" font-size="28" font-family="sans-serif" font-weight="700">爽點</text><text x="75" y="276" fill="#fff" font-size="22" font-family="sans-serif">小智拆出信託強制代理，逼對方接受三方盲核與公開投標。</text><text x="75" y="342" fill="#ff9fb4" font-size="28" font-family="sans-serif" font-weight="700">曖昧</text><text x="75" y="383" fill="#fff" font-size="22" font-family="sans-serif">顧知夏掌心貼上他胸口，沈妍書隔門要求先填利益衝突聲明。</text><text x="75" y="449" fill="#a9efb0" font-size="28" font-family="sans-serif" font-weight="700">財富紀律</text><text x="75" y="490" fill="#fff" font-size="22" font-family="sans-serif">十億元未驗未簽不入帳；查核費須監管、驗收、付款後認列。</text><text x="75" y="552" fill="#f4c46d" font-size="22" font-family="sans-serif">鉤子：顧知夏是錨定人——若兩人相愛，立即銷毀信託。</text></svg>
