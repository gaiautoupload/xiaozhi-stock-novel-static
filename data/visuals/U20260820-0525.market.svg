<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071521"/><rect x="44" y="40" width="1112" height="595" rx="28" fill="#0d2435" stroke="#24627d"/>
  <text x="82" y="105" fill="#7ee7ff" font-size="24" font-family="sans-serif">小智股海發財記｜U20260820-0525</text>
  <text x="82" y="158" fill="#fff" font-size="34" font-weight="700" font-family="sans-serif">十二萬繞過三十年，她母親卻把小智列為唯一收款人</text>
  <rect x="82" y="205" width="495" height="165" rx="20" fill="#12364a"/><text x="112" y="250" fill="#bfeeff" font-size="22" font-family="sans-serif">財富帳本</text>
  <text x="112" y="300" fill="#fff" font-size="30" font-family="sans-serif">總資產 146,000 元</text><text x="112" y="340" fill="#8fe0b0" font-size="21" font-family="sans-serif">認列收入 120,000｜股票成交 0</text>
  <rect x="605" y="205" width="469" height="165" rx="20" fill="#12364a"/><text x="635" y="250" fill="#bfeeff" font-size="22" font-family="sans-serif">市場錨點（前收）</text>
  <text x="635" y="300" fill="#fff" font-size="29" font-family="sans-serif">TAIEX 44,719.35</text><text x="635" y="340" fill="#ffb6b6" font-size="21" font-family="sans-serif">TPEx 384.79｜法人 -708.48 億</text>
  <text x="82" y="430" fill="#ffd37e" font-size="24" font-weight="700" font-family="sans-serif">爽點：他把母親的三十年金流拆成可稽核證據，不讓控制款碰到自己。</text>
  <text x="82" y="478" fill="#ffc6e7" font-size="23" font-family="sans-serif">情感鉤子：沈妍書牽著他公開走出機房，差一公分的吻變成共同作證。</text>
  <text x="82" y="526" fill="#d9e9f2" font-size="22" font-family="sans-serif">財富鉤子：第二階段 80,000 元已簽、尚未驗收付款，不列收入。</text>
  <text x="82" y="574" fill="#ffdf9f" font-size="22" font-family="sans-serif">人物鉤子：十八年前的預登記配偶欄，寫著「沈妍書」。</text>
  <text x="82" y="612" fill="#7f9faf" font-size="16" font-family="sans-serif">歷史回補｜精確跨資產分鐘值無法證實者標示 unavailable</text>
</svg>
