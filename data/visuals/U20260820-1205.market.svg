<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16112c"/><stop offset="1" stop-color="#3b1733"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><rect x="55" y="55" width="1090" height="565" rx="32" fill="#130f25" opacity=".86" stroke="#e2a3cf"/><text x="90" y="120" fill="#ffafd9" font-size="25" font-family="sans-serif">U20260820-1205｜12:05</text><text x="90" y="190" fill="#fff" font-size="43" font-weight="700" font-family="sans-serif">一股台積電想替他選妻</text><text x="90" y="280" fill="#ffdca8" font-size="31" font-family="sans-serif">爽點：以證據與現金委任奪下主持權</text><text x="90" y="340" fill="#f4d7ff" font-size="31" font-family="sans-serif">修羅場：選擇靠近，不讓系統決定親密</text><text x="90" y="425" fill="#fff" font-size="30" font-family="sans-serif">人物鉤子：配偶識別竟等於林小智本人</text><text x="90" y="520" fill="#9fe3c0" font-size="28" font-family="sans-serif">股票零成交｜未交割權利不列帳</text><text x="90" y="575" fill="#90baff" font-size="24" font-family="sans-serif">《小智股海發財記》固定發布包</text></svg>
