  <text x="80" y="1110" class="ok">多：守支撐＋權值承接＋族群共振</text>
  <text x="80" y="1150" class="b">基：震盪測支撐，維持現金與WAIT</text>
  <text x="80" y="1190" class="risk">空：跌破45,225與389.92且同步惡化</text>
  <text x="80" y="1240" class="s">風險：油價、長債、科技負廣度、台幣偏弱</text>
  <text x="80" y="1275" class="s">09:00後才用真實成交驗證。</text>
  <rect x="615" y="1020" width="535" height="300" rx="22" class="card"/>
  <text x="645" y="1065" class="h">帳本摘要</text>
  <text x="645" y="1110" class="b">總資產　26,000 元</text>
  <text x="645" y="1150" class="b">自由現金　20,000 元</text>
  <text x="645" y="1190" class="b">限制款　6,000 元</text>
  <text x="645" y="1230" class="b">股票成交／持倉　0／0</text>
  <text x="645" y="1270" class="s">32萬追加案與342筆權利資料均零認列。</text>
  <rect x="50" y="1350" width="1100" height="95" rx="18" fill="#112b38" stroke="#38756b"/>
  <text x="80" y="1392" class="b">下一步：08:30確認可靠盤前資料；09:00–09:20看支撐、權值承接、櫃買廣度與機器人共振。</text>
  <text x="80" y="1425" class="s">觀察不等於成交；確認訊號未到，不追價、不預設獲利。</text>
