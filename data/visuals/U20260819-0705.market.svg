<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <rect width="1200" height="1500" fill="#07111f"/>
  <style>
    text{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;fill:#eaf3ff}
    .title{font-size:44px;font-weight:800}.sub{font-size:23px;fill:#9fb4ca}.h{font-size:28px;font-weight:700;fill:#7ee0c4}
    .b{font-size:22px}.s{font-size:18px;fill:#b9c8d8}.wait{fill:#ffcf5a;font-weight:800}.risk{fill:#ff8290}.ok{fill:#79e6b0}
    .card{fill:#0e2034;stroke:#23425e;stroke-width:2}.line{stroke:#2b526f;stroke-width:2}
  </style>
  <text x="60" y="80" class="title">07:05 台股觀察卡｜休市不假裝即時</text>
  <text x="60" y="120" class="sub">U20260819-0705｜資料時間已標示｜不保證獲利</text>
  <rect x="50" y="160" width="1100" height="205" rx="22" class="card"/>
  <text x="80" y="205" class="h">市場摘要</text>
  <text x="80" y="245" class="b">加權 45,308.68｜低 45,225.42　櫃買 390.83｜低 389.92</text>
  <text x="80" y="282" class="b">TSM ADR 413.41 美元（-4.07%）｜SOX -4.98%｜Nasdaq -1.33%</text>
  <text x="80" y="319" class="b">USD/TWD 31.945（8/18央行收盤）｜新期指／DXY／USDJPY：</text>
  <text x="870" y="319" class="wait">unavailable</text>
  <text x="80" y="348" class="s">ABC情境：偏A段 63%，07:05無可靠新數字，不機械調整。</text>
