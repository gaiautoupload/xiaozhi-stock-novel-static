  <text x="80" y="440" class="h">五檔觀察｜全部 WAIT</text>
  <line x1="80" y1="470" x2="1120" y2="470" class="line"/>
  <text x="80" y="515" class="b">4576 大銀微系統</text><text x="400" y="515" class="wait">A-／WAIT</text>
  <text x="590" y="515" class="s">確認：守45,225＋運控2–3檔共振</text>
  <text x="590" y="545" class="s">失效：開高走低／破支撐且廣度惡化</text>
  <line x1="80" y1="570" x2="1120" y2="570" class="line"/>
  <text x="80" y="615" class="b">2049 上銀</text><text x="400" y="615" class="wait">B／WAIT</text>
  <text x="590" y="615" class="s">確認：零組件同步＋權值止穩</text>
  <text x="590" y="645" class="s">失效：族群無共振／權值擴跌</text>
  <line x1="80" y1="670" x2="1120" y2="670" class="line"/>
  <text x="80" y="715" class="b">2359 所羅門</text><text x="400" y="715" class="wait">C+／WAIT</text>
  <text x="590" y="715" class="s">確認：感知多檔共振＋拉回承接</text>
  <text x="590" y="745" class="s">失效：孤軍急拉／爆量不漲</text>
  <line x1="80" y1="770" x2="1120" y2="770" class="line"/>
  <text x="80" y="815" class="b">6125 廣運</text><text x="400" y="815" class="wait">B-／WAIT</text>
  <text x="590" y="815" class="s">確認：核心先強＋設備鏈擴散</text>
  <text x="590" y="845" class="s">失效：無擴散／核心先跌</text>
  <line x1="80" y1="870" x2="1120" y2="870" class="line"/>
  <text x="80" y="915" class="b">2330 台積電</text><text x="400" y="915" class="wait">B-／WAIT</text>
  <text x="590" y="915" class="s">確認：守45,225＋權值與廣度改善</text>
  <text x="590" y="945" class="s">失效：破支撐且電子／櫃買同步惡化</text>
