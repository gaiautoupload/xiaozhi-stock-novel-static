<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#10141d"/><text x="70" y="90" fill="white" font-size="44" font-family="sans-serif" font-weight="700">U20260818-1905｜機器人展前夜：四檔全數 WAIT</text><text x="70" y="145" fill="#cbd5e1" font-size="25" font-family="sans-serif">盤後研究｜不新增未驗證價格｜本金 NT$20,000｜0 成交</text><g font-family="sans-serif"><rect x="70" y="210" width="1060" height="220" rx="24" fill="#182131"/><text x="100" y="265" fill="white" font-size="32" font-weight="700">市場摘要</text><text x="100" y="315" fill="#dbeafe" font-size="25">8/19 機器人與自動化展事件窗口前夕；明日以量價、相對強弱、族群共振重考交易資格。</text><text x="100" y="365" fill="#fbbf24" font-size="25">原則：好故事 ≠ 買進許可。條件不齊，繼續 WAIT。</text></g><g font-family="sans-serif" font-size="25"><text x="80" y="500" fill="white" font-size="32" font-weight="700">觀察清單</text><text x="90" y="565" fill="#86efac">4576 大銀微系統｜A｜波段｜WAIT</text><text x="110" y="610" fill="#cbd5e1">確認：量能放大＋相對強＋2–3檔零組件共振</text><text x="110" y="650" fill="#fca5a5">失效：開高回落／爆量長上影／族群不跟</text><text x="90" y="725" fill="#93c5fd">2359 所羅門｜A-｜短線事件｜WAIT</text><text x="110" y="770" fill="#cbd5e1">確認：量價同步＋首波支撐不破＋感知族群擴散</text><text x="110" y="810" fill="#fca5a5">失效：爆量不漲／跌破首波支撐</text><text x="90" y="885" fill="#fde68a">6125 廣運｜B+｜短線｜WAIT</text><text x="110" y="930" fill="#cbd5e1">確認：核心股帶隊＋設備鏈擴散＋量增站穩開盤區</text><text x="110" y="970" fill="#fca5a5">失效：量縮／相對弱勢／無擴散</text><text x="90" y="1045" fill="#fde68a">2049 上銀｜B+｜波段研究池｜WAIT</text><text x="110" y="1090" fill="#cbd5e1">確認：核心零組件同步轉強＋量價健康</text><text x="110" y="1130" fill="#fca5a5">失效：新聞熱但相對弱／族群轉弱</text></g><rect x="70" y="1210" width="1060" height="270" rx="24" fill="#182131"/><g font-family="sans-serif"><text x="100" y="1270" fill="white" font-size="32" font-weight="700">帳本</text><text x="100" y="1325" fill="#dbeafe" font-size="26">本金 NT$20,000｜持股 0｜成交 0｜已實現 0｜未實現 0</text><text x="100" y="1375" fill="#dbeafe" font-size="26">可用資金 NT$20,000｜6000 元案款：應收、未入帳</text><text x="100" y="1425" fill="#fbbf24" font-size="25">月度合作：洽談中，0 元入帳。未驗收、未付款，不灌本金。</text></g><text x="70" y="1550" fill="#94a3b8" font-size="20" font-family="sans-serif">僅為小說產線中的研究紀錄與風控劇本，不保證獲利。</text></svg>
