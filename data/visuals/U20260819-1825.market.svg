<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#100f1d"/><rect x="42" y="42" width="1116" height="546" rx="28" fill="#1b1830" stroke="#5b527f"/><text x="78" y="110" fill="#f4c46d" font-size="38" font-family="sans-serif" font-weight="700">第七十八回｜十億只是未驗證的字</text><text x="78" y="165" fill="#e7dcff" font-size="25" font-family="sans-serif">信託誘惑 × 三方盲測 × 飯店開門</text><text x="78" y="235" fill="#9ad8ff" font-size="29" font-family="sans-serif" font-weight="700">爽點</text><text x="78" y="276" fill="#fff" font-size="23" font-family="sans-serif">小智拒簽十億，把豪門祕密改造成可審計的公開案。</text><text x="78" y="342" fill="#ff9fb4" font-size="29" font-family="sans-serif" font-weight="700">修羅場</text><text x="78" y="383" fill="#fff" font-size="23" font-family="sans-serif">顧知夏搶房卡、沈妍書扣袖，他牽住兩人的手一起上樓。</text><text x="78" y="449" fill="#a9efb0" font-size="29" font-family="sans-serif" font-weight="700">財富紀律</text><text x="78" y="490" fill="#fff" font-size="23" font-family="sans-serif">十億元信託未核未簽；競標案須託管、盲測、驗收才認列。</text><text x="78" y="552" fill="#f4c46d" font-size="23" font-family="sans-serif">鉤子：女人說沒生他，只買了他的名字；紙袋寫「原名——顧」。</text></svg>
