<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#07111f"/><rect x="42" y="42" width="1116" height="546" rx="28" fill="#0d2034" stroke="#2e5674"/><text x="78" y="110" fill="#f4c46d" font-size="38" font-family="sans-serif" font-weight="700">第七十七回｜先查那一分鐘</text><text x="78" y="165" fill="#d9e8f2" font-size="25" font-family="sans-serif">身世炸彈 × 證據鏈 × 資料信託</text><text x="78" y="235" fill="#8ed6ff" font-size="29" font-family="sans-serif" font-weight="700">爽點</text><text x="78" y="276" fill="#fff" font-size="23" font-family="sans-serif">小智用 UTC 錯位與存取環紀錄，拆掉控制權陷阱。</text><text x="78" y="342" fill="#ff9fb4" font-size="29" font-family="sans-serif" font-weight="700">情感張力</text><text x="78" y="383" fill="#fff" font-size="23" font-family="sans-serif">顧知夏整理衣領、他替她別髮；沈妍書當場吃醋。</text><text x="78" y="449" fill="#a9efb0" font-size="29" font-family="sans-serif" font-weight="700">財富紀律</text><text x="78" y="490" fill="#fff" font-size="23" font-family="sans-serif">4.2億元未簽未付不入帳；查核費先進第三方監管。</text><text x="78" y="552" fill="#f4c46d" font-size="23" font-family="sans-serif">鉤子：銀箱報告顯示「同胞關係」，照片中的女人也姓林。</text></svg>
